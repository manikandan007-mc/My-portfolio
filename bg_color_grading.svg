<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0F0F12" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="300" fill="#F59E0B" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="300" fill="#EF4444" opacity="0.15" filter="url(#glow)"/>

  <g transform="translate(400, 250)">
    <circle cx="-120" cy="0" r="180" fill="#EF4444" opacity="0.5" filter="url(#glow)"/><circle cx="120" cy="0" r="180" fill="#3B82F6" opacity="0.5" filter="url(#glow)"/><circle cx="0" cy="-120" r="180" fill="#10B981" opacity="0.5" filter="url(#glow)"/><circle r="60" fill="white" opacity="0.9" filter="url(#glow)"/>
  </g>
  
  <!-- Content Overlay Gradient (for text readability) -->
  <rect x="0" y="300" width="800" height="200" fill="url(#textGrad)" opacity="0.8">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>
    </defs>
  </rect>
</svg>