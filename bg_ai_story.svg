<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0F0F12" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="300" fill="#6366F1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="300" fill="#EC4899" opacity="0.15" filter="url(#glow)"/>

  <g transform="translate(400, 250)">
    <polygon points="-250,150 250,150 0,-250" fill="url(#grad1)" opacity="0.1"/><path d="M0,-200 L180,100 L-180,100 Z" fill="url(#grad1)" filter="url(#glow)" opacity="0.7"/><circle r="80" fill="#0A0A0C" stroke="white" stroke-width="6"/><g transform="translate(0, -10)"><path d="M-25,10 Q0,40 25,10" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/><circle cx="-20" cy="-10" r="8" fill="white"/><circle cx="20" cy="-10" r="8" fill="white"/></g>
  </g>
  
  <!-- Content Overlay Gradient (for text readability) -->
  <rect x="0" y="300" width="800" height="200" fill="url(#textGrad)" opacity="0.8">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>
    </defs>
  </rect>
</svg>