<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0F0F12" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="300" fill="#10B981" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="300" fill="#3B82F6" opacity="0.15" filter="url(#glow)"/>

  <g transform="translate(400, 250)">
    <circle r="250" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.2"/><circle r="180" fill="none" stroke="url(#grad1)" stroke-width="4" stroke-dasharray="20,20" opacity="0.3"/><circle r="100" fill="url(#grad1)" filter="url(#glow)" opacity="0.7"/><rect x="-100" y="-5" width="200" height="10" fill="white" opacity="0.8"/><rect x="-5" y="-100" width="10" height="200" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Content Overlay Gradient (for text readability) -->
  <rect x="0" y="300" width="800" height="200" fill="url(#textGrad)" opacity="0.8">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>
    </defs>
  </rect>
</svg>