<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Abstract Shapes -->
  <g transform="translate(300, 300)">
    <circle r="200" fill="none" stroke="url(#g1)" stroke-width="2" stroke-dasharray="10,20" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    
    <!-- Floating Icons -->
    <g transform="translate(-150, -150) rotate(-15)">
      <rect width="60" height="40" rx="8" fill="#94A3B8" filter="url(#glow)" />
      <path d="M20,10 L45,20 L20,30 Z" fill="white" />
    </g>
    
    <g transform="translate(120, -100) rotate(20)">
      <circle r="30" fill="#3B82F6" filter="url(#glow)" />
      <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="white" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <g transform="translate(80, 150) rotate(-10)">
      <rect width="50" height="50" rx="10" fill="#1E3A8A" filter="url(#glow)" />
      <path d="M10,25 L40,25 M25,10 L25,40" stroke="white" stroke-width="4" />
    </g>
    
    <g transform="translate(-180, 100) rotate(45)">
      <path d="M0,0 L40,0 L20,-30 Z" fill="#F59E0B" filter="url(#glow)" />
    </g>

    <!-- Dynamic Lines -->
    <path d="M-250,0 L250,0" stroke="white" stroke-width="1" opacity="0.1" />
    <path d="M0,-250 L0,250" stroke="white" stroke-width="1" opacity="0.1" />
    
    <!-- Central Glow Bolt -->
    <path d="M-20,-100 L40,0 L-40,20 L20,120" fill="none" stroke="white" stroke-width="15" stroke-linecap="round" filter="url(#glow)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>