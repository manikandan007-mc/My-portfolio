<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0F0F12" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="300" fill="#8B5CF6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="300" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>

  <g transform="translate(400, 250)">
    <path d="M-300,-150 L300,-150 L300,150 L-300,150 Z" fill="url(#grad1)" opacity="0.05"/><circle r="150" fill="url(#grad1)" filter="url(#glow)" opacity="0.6"/><g transform="scale(1.2)"><path d="M-60,-40 L60,-40 L60,40 L-60,40 Z" fill="white" opacity="0.3"/><circle cx="-40" cy="-20" r="10" fill="white"/><circle cx="40" cy="-20" r="10" fill="white"/><path d="M-30,20 Q0,45 30,20" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/></g>
  </g>
  
  <!-- Content Overlay Gradient (for text readability) -->
  <rect x="0" y="300" width="800" height="200" fill="url(#textGrad)" opacity="0.8">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>
    </defs>
  </rect>
</svg>