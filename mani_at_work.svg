<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Desk -->
  <rect x="50" y="350" width="500" height="20" rx="10" fill="#2D3748" />
  
  <!-- Monitors (Catchy & Pro) -->
  <rect x="70" y="150" width="140" height="90" rx="10" fill="#1A202C" stroke="#4A5568" stroke-width="4" />
  <rect x="75" y="155" width="130" height="80" rx="5" fill="url(#screenGrad)" opacity="0.3" />
  
  <rect x="230" y="100" width="140" height="90" rx="10" fill="#1A202C" stroke="#4A5568" stroke-width="4" />
  <rect x="235" y="105" width="130" height="80" rx="5" fill="url(#screenGrad)" opacity="0.6" />
  
  <rect x="390" y="150" width="140" height="90" rx="10" fill="#1A202C" stroke="#4A5568" stroke-width="4" />
  <rect x="395" y="155" width="130" height="80" rx="5" fill="url(#screenGrad)" opacity="0.3" />

  <!-- Mani (Funny Cartoon Character) -->
  <!-- Body -->
  <rect x="250" y="300" width="100" height="100" rx="30" fill="#1D4ED8" />
  
  <!-- Head -->
  <circle cx="300" cy="240" r="70" fill="#FFDBAC" />
  <path d="M230,240 Q210,120 300,100 T370,240" fill="none" stroke="#2D3748" stroke-width="20" stroke-linecap="round" />
  
  <!-- Focusing Eyes -->
  <circle cx="275" cy="235" r="15" fill="white" />
  <circle cx="325" cy="235" r="15" fill="white" />
  <circle cx="280" cy="235" r="6" fill="#2D3748" />
  <circle cx="320" cy="235" r="6" fill="#2D3748" />
  
  <!-- Confident Smile -->
  <path d="M275,275 Q300,300 325,275" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />

  <!-- Hands on Mouse/Keyboard -->
  <rect x="230" y="340" width="40" height="20" rx="10" fill="#FFDBAC" />
  <rect x="330" y="340" width="40" height="20" rx="10" fill="#FFDBAC" />
  
  <!-- Glowing Effects -->
  <circle cx="300" cy="145" r="5" fill="white" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>