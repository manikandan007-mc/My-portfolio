<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDBAC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1C27D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="300" cy="300" r="250" fill="url(#skin)" opacity="0.1" filter="url(#glow)"/>

  <!-- Body -->
  <rect x="200" y="400" width="200" height="200" rx="40" fill="#1E40AF" />
  
  <!-- Head (Large, for cartoon feel) -->
  <circle cx="300" cy="280" r="150" fill="url(#skin)" />
  
  <!-- Funny Hair (Spiky / Creative) -->
  <path d="M150,280 Q100,100 300,50 T450,280" fill="none" stroke="#2D3748" stroke-width="40" stroke-linecap="round" />
  <path d="M200,150 L220,100 M300,130 L300,70 M400,150 L380,100" stroke="#2D3748" stroke-width="15" stroke-linecap="round" />

  <!-- Big Eyes -->
  <circle cx="230" cy="260" r="35" fill="white" stroke="#2D3748" stroke-width="4"/>
  <circle cx="370" cy="260" r="35" fill="white" stroke="#2D3748" stroke-width="4"/>
  <circle cx="240" cy="260" r="15" fill="#2D3748" />
  <circle cx="360" cy="260" r="15" fill="#2D3748" />
  <circle cx="245" cy="255" r="5" fill="white" />
  <circle cx="355" cy="255" r="5" fill="white" />

  <!-- Funny Grin -->
  <path d="M220,340 Q300,420 380,340" fill="none" stroke="#2D3748" stroke-width="8" stroke-linecap="round" />
  <circle cx="210" cy="335" r="5" fill="#E53E3E" />
  <circle cx="390" cy="335" r="5" fill="#E53E3E" />

  <!-- Headphones (A must for editors) -->
  <rect x="130" y="230" width="40" height="100" rx="20" fill="#1A202C" />
  <rect x="430" y="230" width="40" height="100" rx="20" fill="#1A202C" />
  <path d="M150,230 Q300,50 450,230" fill="none" stroke="#1A202C" stroke-width="25" />
  <circle cx="150" cy="280" r="10" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="450" cy="280" r="10" fill="#3B82F6" filter="url(#glow)" />

  <!-- Floating Pen/Camera (Tools of the trade) -->
  <g transform="translate(100, 450) rotate(-30)">
    <rect width="20" height="100" rx="5" fill="#4A5568" />
    <path d="M0,0 L20,0 L10,-20 Z" fill="#2D3748" />
    <circle cx="10" cy="50" r="5" fill="#3B82F6" filter="url(#glow)" />
  </g>

  <g transform="translate(500, 450) rotate(30)">
    <rect width="60" height="40" rx="10" fill="#4A5568" />
    <circle cx="30" cy="20" r="12" fill="#2D3748" />
    <rect x="60" y="10" width="10" height="20" fill="#2D3748" />
  </g>
</svg>