<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0F0F12" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="300" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="300" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>

  <g transform="translate(400, 250)">
    <line x1="-400" y1="0" x2="400" y2="0" stroke="url(#grad1)" stroke-width="6" filter="url(#glow)"/><line x1="0" y1="-250" x2="0" y2="250" stroke="url(#grad1)" stroke-width="6" filter="url(#glow)"/><circle r="100" fill="none" stroke="white" stroke-width="3" stroke-dasharray="15,10"/><rect x="-25" y="-25" width="50" height="50" fill="white" filter="url(#glow)"/><circle r="200" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
  </g>
  
  <!-- Content Overlay Gradient (for text readability) -->
  <rect x="0" y="300" width="800" height="200" fill="url(#textGrad)" opacity="0.8">
    <defs>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:transparent;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>
    </defs>
  </rect>
</svg>